  <!-- ═══════════════════════════════════════════════
       STRUCTURED DATA — FAQ Page (AEO — ChatGPT/Gemini/Google AI)
  ═══════════════════════════════════════════════ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What does GST registration cost in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "GST registration through Accu Nex Taxation Services starts at ₹999 (professional fee only). Government fees for GST registration on gst.gov.in are nil — it is free. The professional fee covers documentation, ARN generation, query resolution, and follow-up until the GSTIN is issued, typically within 3–7 working days."
        }
      },
      {
        "@type": "Question",
        "name": "What documents are required for ITR filing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Documents required for ITR filing include: PAN card, Aadhaar card, Form 16 (for salaried individuals), Form 26AS and AIS from incometax.gov.in, bank statements, investment proofs (80C, 80D), home loan interest certificate, and details of any capital gains. For business owners, additionally required are profit & loss account and balance sheet."
        }
      },
      {
        "@type": "Question",
        "name": "How long does company registration take in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Company registration (Private Limited Company) in India typically takes 7–15 working days through the MCA SPICe+ portal. This includes obtaining DIN (Director Identification Number), DSC (Digital Signature Certificate), name approval, and Certificate of Incorporation. Accu Nex Taxation Services handles the entire process online with no office visit required."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need a CA to file my income tax return?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Legally, most individuals can file ITR-1 or ITR-4 without a CA. However, a CA is mandatory for: Tax audit under Section 44AB (turnover above ₹1 crore for business or ₹50 lakh for professionals), statutory audit under Companies Act, and GSTR-9C reconciliation. A CA helps maximize deductions, reconcile AIS/26AS, and avoid tax notices, making professional filing worthwhile."
        }
      },
      {
        "@type": "Question",
        "name": "What is the penalty for not filing GST returns?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The penalty for late GST return filing is ₹50 per day (₹25 CGST + ₹25 SGST) for regular taxpayers, with a maximum of ₹5,000. For NIL returns, the late fee is ₹20 per day (₹10 + ₹10), capped at ₹500. Additionally, interest at 18% per annum applies on the unpaid tax amount. Non-filing can also lead to GSTIN suspension."
        }
      },
      {
        "@type": "Question",
        "name": "What is the GST registration threshold in India 2025?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "As of 2025, GST registration is mandatory if annual aggregate turnover exceeds: ₹40 lakh for goods suppliers in most states (₹20 lakh in special category states), ₹20 lakh for service providers (₹10 lakh in special category states). E-commerce operators and inter-state suppliers must register regardless of turnover. Accu Nex provides free eligibility assessment."
        }
      },
      {
        "@type": "Question",
        "name": "What is the TDS deduction rate for professional services?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TDS on professional and technical services under Section 194J is 10% when the payment exceeds ₹30,000 in a financial year. For royalties and non-compete fees it is also 10%. For call centres specifically, TDS under 194J is 2%. TDS must be deducted at source and deposited by the 7th of the following month, with quarterly TDS returns (Form 26Q) filed by Accu Nex."
        }
      },
      {
        "@type": "Question",
        "name": "Can a CA file income tax return and GST return online?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. All ITR filing is done on incometax.gov.in and all GST returns on gst.gov.in — both 100% online. Accu Nex Taxation Services handles the complete process: you share documents via WhatsApp or email, we prepare and file on your behalf using authorised CA login credentials, and you receive the acknowledgment. No office visit is required."
        }
      },
      {
        "@type": "Question",
        "name": "What is MSME Udyam registration and is it free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Udyam Registration is the official MSME registration on udyamregistration.gov.in, replacing the old Udyog Aadhaar. It is completely free on the government portal — no government fee is charged. Accu Nex charges only a professional fee for guidance, documentation, and ensuring correct classification as Micro, Small, or Medium enterprise. Benefits include priority lending, subsidy eligibility, and lower interest rates."
        }
      },
      {
        "@type": "Question",
        "name": "What is the fee for online CA services in India?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Online CA service fees at Accu Nex Taxation Services: GST Registration from ₹999, ITR Filing (salaried) from ₹499, Company Registration from ₹6,999, TDS return from ₹1,499/quarter, Bookkeeping from ₹2,499/month, ROC compliance from ₹3,999/year. All fees are fixed and transparent — government fees are shown separately at actuals. We issue proper GST invoices for all payments."
        }
      }
    ]
  }
  </script>
